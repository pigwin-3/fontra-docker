name: Docker build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    # Daily check for a new Fontra release. Runs that find the newest
    # release already published stop early.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      fontra_version:
        description: Fontra tag, branch or commit to build (empty = newest release)
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FONTRA_REPO: https://github.com/fontra/fontra.git

# Images, all pushed to the GitHub Container Registry:
#   ghcr.io/<owner>/<repo>           Fontra (single-user and multi-user)
#   ghcr.io/<owner>/<repo>-exporter  export page for the multi-user setup
#   ghcr.io/<owner>/<repo>-robocjk   django-robo-cjk for the multi-user setup
#   ghcr.io/<owner>/<repo>-proxy     nginx for the multi-user setup

jobs:
  fontra:
    # Fontra and the exporter, which is built on top of the Fontra image.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pick the Fontra version
        id: fontra
        env:
          REQUESTED: ${{ inputs.fontra_version }}
          # Scheduled runs always use the default branch, but their event
          # payload doesn't say which branch that is.
          DEFAULT_BRANCH: ${{ github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch }}
        run: |
          if [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
            newest=false
          else
            version=$(git ls-remote --tags --refs --sort=-v:refname "$FONTRA_REPO" \
              | sed -n 's#^.*refs/tags/##p' \
              | grep -E '^[0-9]+(\.[0-9]+)+$' \
              | head -n 1)
            newest=true
          fi
          test -n "$version"
          # Image tags may only contain letters, digits, "_", "." and "-".
          tag=$(printf '%s' "$version" | tr -c 'A-Za-z0-9_.-' '-')
          # "latest" goes to the newest release built from the default branch.
          latest=false
          if [ "$newest" = true ] && [ "$DEFAULT_BRANCH" = true ]; then
            latest=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "Fontra version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already published
        id: published
        if: github.event_name == 'schedule'
        env:
          TAG: ${{ steps.fontra.outputs.tag }}
        run: |
          image="$REGISTRY/${IMAGE_NAME,,}:$TAG"
          if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "$image is already published, nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Fontra image metadata
        id: meta
        if: steps.published.outputs.exists != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.fontra.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.fontra.outputs.latest == 'true' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.fontra.outputs.version }}

      - name: Extract exporter image metadata
        id: meta-exporter
        if: steps.published.outputs.exists != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-exporter
          tags: |
            type=raw,value=${{ steps.fontra.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.fontra.outputs.latest == 'true' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.fontra.outputs.version }}

      - name: Build Fontra
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fontra-docker:test
          build-args: |
            FONTRA_VERSION=${{ steps.fontra.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Fontra
        if: steps.published.outputs.exists != 'true'
        env:
          EXPECTED: ${{ steps.fontra.outputs.version }}
        run: |
          version=$(docker run --rm fontra-docker:test --version)
          echo "fontra --version: $version"
          if printf '%s' "$EXPECTED" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            test "$version" = "$EXPECTED"
          fi
          docker run -d --name smoke -p 8000:8000 fontra-docker:test
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          # The empty /fonts folder should have received a default font.
          projects=$(curl -fsS http://127.0.0.1:8000/projectlist)
          echo "projects: $projects"
          echo "$projects" | grep -q default.designspace
          docker rm -f smoke

      - name: Push Fontra
        if: github.event_name != 'pull_request' && steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FONTRA_VERSION=${{ steps.fontra.outputs.version }}
          cache-from: type=gha

      - name: Build exporter
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: exporter
          load: true
          tags: fontra-docker-exporter:test
          build-args: |
            FONTRA_VERSION=${{ steps.fontra.outputs.version }}
          cache-from: type=gha

      - name: Test exporter
        if: steps.published.outputs.exists != 'true'
        run: |
          docker run -d --name exporter -p 8001:8000 fontra-docker-exporter:test
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8001/export/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/export/ | grep -q "Log in with your Fontra account"
          docker rm -f exporter

      - name: Push exporter
        if: github.event_name != 'pull_request' && steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: exporter
          push: true
          tags: ${{ steps.meta-exporter.outputs.tags }}
          labels: ${{ steps.meta-exporter.outputs.labels }}
          build-args: |
            FONTRA_VERSION=${{ steps.fontra.outputs.version }}
          cache-from: type=gha

  multiuser:
    # The django-robo-cjk and nginx images. They don't depend on the Fontra
    # version, so the daily schedule doesn't rebuild them.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: robocjk
            context: multiuser/robocjk
          - image: proxy
            context: multiuser/nginx

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the compose files
        if: matrix.image == 'robocjk'
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
          cd multiuser
          ./init-env.sh
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
